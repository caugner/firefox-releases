name: sync-releases

on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      version:
        description: "First major version to import (default: the one after the newest tag)"
        required: false
        default: ""
      dry-run:
        description: Build the commits and tags without pushing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Check out releases
        uses: actions/checkout@v4
        with:
          ref: releases
          path: releases
          fetch-depth: 1

      - name: Import missing releases one at a time
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          start="$VERSION"
          if [ -z "$start" ]; then
            latest=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | sed -n 's|.*refs/tags/v\([0-9][0-9.]*\)$|\1|p' | sort -V | tail -n 1)
            start=$(( ${latest%%.*} + 1 ))
          fi
          versions=$(curl -fsSL https://raw.githubusercontent.com/mdn/browser-compat-data/refs/heads/main/browsers/firefox.json | \
            jq -r '.browsers.firefox.releases | to_entries[] | select(.value.status != "beta" and .value.status != "nightly" and .value.status != "planned") | .key' | \
            awk -v s="$start" '$1 ~ /^[0-9]+$/ && $1 >= s' | sort -n)
          if [ -z "$versions" ]; then
            echo "No new releases since $start."
            exit 0
          fi

          git -C releases config user.name "github-actions[bot]"
          git -C releases config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for v in $versions; do
            echo "::group::Firefox $v"
            scripts/download.sh "$v" "$v"
            if [ ! -f "firefox-$v-source.tar.xz" ]; then
              echo "Tarball for Firefox $v is not available yet."
              exit 1
            fi
            scripts/repo.sh "$v" "$v"
            rm -f "firefox-$v-source.tar.xz"
            if [ "$DRY_RUN" = "true" ]; then
              git -C releases log -1 --format='%h %s'
            else
              git -C releases push --atomic origin HEAD:refs/heads/releases "refs/tags/v$v"
            fi
            echo "::endgroup::"
          done
